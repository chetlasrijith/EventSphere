services:
  db:
    image: postgres:16-alpine
    container_name: eventsphere-db
    environment:
      POSTGRES_USER: eventsphere
      POSTGRES_PASSWORD: eventsphere
      POSTGRES_DB: eventsphere
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventsphere -d eventsphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://eventsphere:eventsphere@db:5432/eventsphere
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health')
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: